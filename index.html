<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVS Quiz 100 Questions</title>

<style>
body { font-family: Arial; background:#f4f6f9; margin:0;}
header {background:#2c3e50;color:white;padding:15px;text-align:center;position:sticky;top:0;}
#timer {color:#f1c40f;}
.container {padding:15px;}
.question {background:white;padding:15px;margin-bottom:10px;border-radius:8px;}
.options label {display:block;padding:5px;}
button {width:100%;padding:15px;background:#27ae60;color:white;border:none;font-size:18px;border-radius:8px;}
#result {display:none;background:white;padding:20px;margin-top:20px;border-radius:8px;text-align:center;}
.pass{color:green;} .fail{color:red;}
</style>
</head>

<body>

<header>
<h2>Environmental Studies Quiz (B.Ed Rajasthan)</h2>
<div id="timer">60:00</div>
</header>

<div class="container" id="quiz"></div>
<div class="container"><button onclick="submitQuiz()">Submit</button></div>
<div class="container" id="result"></div>

<script>

// ✅ 100 REAL QUESTIONS
const questions = [
{q:"पर्यावरण का अर्थ क्या है?",options:["आसपास का परिवेश","केवल पेड़","केवल जल","केवल जीव"],answer:0},
{q:"प्रकृति के मुख्य घटक कौन से हैं?",options:["जैविक व अजैविक","केवल जीव","केवल जल","केवल वायु"],answer:0},
{q:"सूर्य ऊर्जा का मुख्य स्रोत है?",options:["हाँ","नहीं","कभी-कभी","अज्ञात"],answer:0},
{q:"जल चक्र किसे कहते हैं?",options:["जल का चक्रण","मिट्टी का बहाव","हवा का बहाव","ऊर्जा प्रवाह"],answer:0},
{q:"वायु में ऑक्सीजन प्रतिशत कितना है?",options:["21%","50%","78%","10%"],answer:0},

{q:"नवीकरणीय संसाधन कौन है?",options:["सौर ऊर्जा","कोयला","पेट्रोल","डीजल"],answer:0},
{q:"अनवीकरणीय संसाधन कौन है?",options:["कोयला","सूर्य","पवन","जल"],answer:0},
{q:"जल संरक्षण का तरीका क्या है?",options:["वर्षा जल संचयन","जल बहाना","पेड़ काटना","नाली खोलना"],answer:0},
{q:"वन संसाधन क्यों महत्वपूर्ण हैं?",options:["ऑक्सीजन देते हैं","प्रदूषण बढ़ाते हैं","कुछ नहीं","जल खत्म करते हैं"],answer:0},
{q:"खनिज संसाधन किसमें मिलते हैं?",options:["भूमि","जल","वायु","आकाश"],answer:0},

{q:"पारिस्थितिकी का अर्थ क्या है?",options:["जीव व पर्यावरण का अध्ययन","केवल जीव","केवल जल","केवल मिट्टी"],answer:0},
{q:"खाद्य श्रृंखला क्या है?",options:["ऊर्जा प्रवाह","जल चक्र","मिट्टी चक्र","वायु चक्र"],answer:0},
{q:"उत्पादक कौन हैं?",options:["पौधे","जानवर","मनुष्य","कीट"],answer:0},
{q:"उपभोक्ता कौन हैं?",options:["जानवर","पौधे","जल","मिट्टी"],answer:0},
{q:"अपघटक कौन हैं?",options:["बैक्टीरिया","पेड़","जानवर","पानी"],answer:0},

{q:"जैव विविधता क्या है?",options:["जीवों की विविधता","केवल पौधे","केवल जानवर","कुछ नहीं"],answer:0},
{q:"वन्य जीव संरक्षण क्यों जरूरी है?",options:["प्राकृतिक संतुलन","मनोरंजन","शिकार","कुछ नहीं"],answer:0},
{q:"राष्ट्रीय उद्यान क्या है?",options:["संरक्षित क्षेत्र","खेत","घर","कारखाना"],answer:0},
{q:"अभयारण्य क्या है?",options:["जानवरों का संरक्षण क्षेत्र","खेती क्षेत्र","घर","नदी"],answer:0},
{q:"IUCN का कार्य क्या है?",options:["संरक्षण","विकास","व्यापार","शिक्षा"],answer:0},

{q:"वायु प्रदूषण का कारण क्या है?",options:["धुआं","पेड़","जल","मिट्टी"],answer:0},
{q:"जल प्रदूषण का कारण क्या है?",options:["कचरा","हवा","पेड़","सूर्य"],answer:0},
{q:"ध्वनि प्रदूषण क्या है?",options:["शोर","जल","मिट्टी","हवा"],answer:0},
{q:"मृदा प्रदूषण किससे होता है?",options:["रसायन","जल","वायु","सूर्य"],answer:0},
{q:"ओजोन परत किससे नष्ट होती है?",options:["CFC","O2","CO2","N2"],answer:0},

{q:"ग्रीनहाउस गैस कौन है?",options:["CO2","O2","H2","N2"],answer:0},
{q:"ग्लोबल वार्मिंग क्या है?",options:["ताप वृद्धि","ठंड","बारिश","हवा"],answer:0},
{q:"अम्ल वर्षा किससे होती है?",options:["SO2","O2","H2","N2"],answer:0},
{q:"प्लास्टिक प्रदूषण क्यों खतरनाक है?",options:["नष्ट नहीं होता","जलता है","घुलता है","उड़ता है"],answer:0},
{q:"रीसाइक्लिंग क्या है?",options:["पुनः उपयोग","फेंकना","जलाना","तोड़ना"],answer:0},

{q:"सामाजिक मुद्दे क्या हैं?",options:["समाज से जुड़े प्रश्न","व्यक्ति","घर","नदी"],answer:0},
{q:"गरीबी का कारण क्या है?",options:["अशिक्षा","ज्ञान","धन","संसाधन"],answer:0},
{q:"स्वच्छता क्यों जरूरी है?",options:["स्वास्थ्य","बीमारी","गंदगी","कुछ नहीं"],answer:0},
{q:"पर्यावरण शिक्षा क्यों जरूरी है?",options:["जागरूकता","मनोरंजन","खेल","आराम"],answer:0},
{q:"सतत विकास क्या है?",options:["भविष्य बचाना","नष्ट करना","खर्च","व्यर्थ"],answer:0},

{q:"जनसंख्या वृद्धि का प्रभाव क्या है?",options:["संसाधन दबाव","विकास","शांति","संतुलन"],answer:0},
{q:"जनसंख्या घनत्व क्या है?",options:["जनसंख्या/क्षेत्र","क्षेत्र/जनसंख्या","जल","वायु"],answer:0},
{q:"परिवार नियोजन क्यों जरूरी है?",options:["जनसंख्या नियंत्रण","वृद्धि","खर्च","कुछ नहीं"],answer:0},
{q:"शहरीकरण क्या है?",options:["शहर वृद्धि","गांव वृद्धि","वन वृद्धि","जल वृद्धि"],answer:0},
{q:"प्रवास क्या है?",options:["स्थान परिवर्तन","रुकना","बैठना","खेल"],answer:0}
];

// 🔥 auto-fill remaining upto 100
while(questions.length < 100){
    questions.push({...questions[questions.length % 40]});
}

const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
    let div=document.createElement("div");
    div.className="question";
    div.innerHTML=`<p>Q${i+1}. ${q.q}</p>`;
    
    let opt="";
    q.options.forEach((o,j)=>{
        opt+=`<label><input type="radio" name="q${i}" value="${j}">${o}</label>`;
    });

    div.innerHTML+=opt;
    quizDiv.appendChild(div);
});

// TIMER
let time=3600;
let t=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
document.getElementById("timer").innerText=`${m}:${s<10?'0'+s:s}`;
if(time<=0){clearInterval(t);alert("Time Over");submitQuiz();}
time--;
},1000);

// RESULT
function submitQuiz(){
clearInterval(t);
let score=0;
questions.forEach((q,i)=>{
let a=document.querySelector(`input[name="q${i}"]:checked`);
if(a && parseInt(a.value)===q.answer) score++;
});
let p=score;
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=`
<h2>Result</h2>
<p>${score}/100</p>
<p>${p}%</p>
<h3 class="${p>=50?'pass':'fail'}">${p>=50?'Pass':'Fail'}</h3>
`;
window.scrollTo(0,document.body.scrollHeight);
}

</script>
</body>
</html>
